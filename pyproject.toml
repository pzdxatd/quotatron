[project]
name = "quotatron"
version = "0.1.0"
description = "Pi Zero W e-paper appliance: rotating quotes/jokes with 30 wipe animations"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
hardware = ["spidev>=3.6", "RPi.GPIO>=0.7"]
preview = [
    # Web preview is dev-only — never deployed to the Pi. Splitting it out
    # of the main `dependencies` saves the Pi from compiling fastapi /
    # uvicorn at install time. Note: uvicorn (no [standard] extras) is
    # used so we DON'T pull in uvloop/httptools/watchfiles which take
    # ~13 minutes to compile on Pi Zero W's single-core ARMv6.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
quotatron = "quotatron.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotatron"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live' --strict-markers"
markers = ["live: requires live API access (run via make verify-sources)"]
