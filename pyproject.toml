[project]
name = "quotatron"
version = "0.1.0"
description = "Pi Zero W e-paper appliance: rotating quotes/jokes with 30 wipe animations"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
hardware = ["spidev>=3.6", "RPi.GPIO>=0.7"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "watchfiles>=0.21",
]

[project.scripts]
quotatron = "quotatron.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotatron"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live' --strict-markers"
markers = ["live: requires live API access (run via make verify-sources)"]
